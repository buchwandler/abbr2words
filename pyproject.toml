[build-system]
requires = ["setuptools>=69", "setuptools-scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "abbr2words"
dynamic = ["version"]
description = "Multilingual, context-aware abbreviation expansion for text normalization and speech"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "Holger Nahrstaedt", email = "nahrstaedt@gmail.com" },
]
keywords = ["abbreviations", "normalization", "nlp", "tts", "text-to-speech"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
examples = [
  "num2words>=0.5.14,<0.6",
]
dev = [
  "build>=1",
  "mypy>=1.11",
  "num2words>=0.5.14,<0.6",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.16",
]

[project.scripts]
abbr2words = "abbr2words.__main__:main"

[project.urls]
Homepage = "https://github.com/buchwandler/abbr2words"
Repository = "https://github.com/buchwandler/abbr2words"
Issues = "https://github.com/buchwandler/abbr2words/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["abbr2words*"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.package-data]
abbr2words = ["py.typed"]

[tool.setuptools_scm]
write_to = "abbr2words/_version.py"
fallback_version = "0.2.3"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["abbr2words"]
branch = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"abbr2words/languages/*.py" = ["E501"]

[tool.ruff.format]
exclude = ["abbr2words/languages/*.py"]

[tool.mypy]
python_version = "3.10"
packages = ["abbr2words"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
