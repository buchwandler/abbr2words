      Added abbr2words.units module with UnitEntry dataclass and numeric-aware
      unit expansion for 7 languages. Covers length, area, volume, mass, temperature,
      speed, duration, and customary units. Units are recognized only after a numeric
      quantity. Updated speech_numbers example to demonstrate unit expansion. Registered
      unit expanders in all language modules.
